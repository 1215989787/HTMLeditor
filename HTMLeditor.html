<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTMLeditor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<style>
:root { --bg:#1a1a2e; --surface:#16213e; --surface2:#0f3460; --text:#e0e0e0; --text-secondary:#a0a0b0; --accent:#4a9eff; --accent-dim:#2a6ecc; --success:#4caf84; --border:#2a2a4a; --scrollbar-thumb:#3a3a5a; --font-mono:'SF Mono',Consolas,Monaco,'Courier New',monospace; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.toolbar .logo{font-weight:700;font-size:15px;color:var(--accent);white-space:nowrap}
.toolbar .sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit}
.btn:hover{background:#1a3a6a;border-color:var(--accent-dim)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#5ab0ff}
.btn svg{width:16px;height:16px;flex-shrink:0}
.search-bar{display:flex;align-items:center;gap:4px;margin-left:auto}
.search-input{width:160px;padding:5px 10px;border:1px solid var(--border);border-radius:4px;background:#12121f;color:var(--text);font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
.search-input:focus{border-color:var(--accent)}
.search-count{font-size:12px;color:var(--text-secondary);min-width:40px;text-align:center;white-space:nowrap}
.search-nav{padding:5px 8px!important;font-size:14px!important;line-height:1}
.filename{font-size:13px;color:var(--text-secondary);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.status{font-size:12px;color:var(--text-secondary);margin-left:auto;display:flex;align-items:center;gap:6px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex-shrink:0}
.status .dot.syncing{background:#f0a040;animation:pulse .6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.main{display:flex;flex:1;min-height:0}
.pane{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.pane-header{display:flex;align-items:center;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;gap:8px;flex-shrink:0}
.pane-header .dot-indicator{width:8px;height:8px;border-radius:50%;background:var(--success)}
.pane-body{flex:1;min-height:0;position:relative;overflow:hidden}
.divider{width:6px;background:var(--border);cursor:col-resize;flex-shrink:0;position:relative;transition:background .15s}
.divider:hover,.divider.active{background:var(--accent)}
.divider::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:28px;border-radius:1px;background:rgba(255,255,255,.3)}
#preview-frame{width:100%;height:100%;border:none;background:#fff}
.preview-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#666;gap:16px;background:#f5f5f5}
.preview-empty svg{width:64px;height:64px;opacity:.4}
.preview-empty p{font-size:14px}
.editor-wrapper{position:relative;height:100%;overflow:hidden}
.editor-wrapper .line-numbers{position:absolute;left:0;top:0;bottom:0;width:50px;padding:14px 0;background:#12121f;color:#555;font-family:var(--font-mono);font-size:13px;line-height:1.65;text-align:right;overflow:hidden;user-select:none;z-index:3;border-right:1px solid #1e1e30}
.editor-wrapper .line-numbers span{display:block;padding-right:12px}
.editor-scroll{position:absolute;left:50px;top:0;right:0;bottom:0;overflow:auto}
.editor-scroll pre{margin:0;padding:14px 16px;font-family:var(--font-mono);font-size:13px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word;tab-size:2;min-height:100%}
.editor-scroll pre code{font-family:inherit;font-size:inherit}
.editor-scroll textarea{position:absolute;top:0;left:0;width:100%;height:100%;padding:14px 16px;font-family:var(--font-mono);font-size:13px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word;tab-size:2;background:transparent;color:transparent;caret-color:#fff;border:none;outline:none;resize:none;z-index:2;overflow:auto}
.editor-scroll textarea::selection{background:rgba(74,158,255,.25)}
.flash{animation:flashAnim .6s ease-out}
@keyframes flashAnim{0%{box-shadow:inset 0 0 0 2px var(--accent)}100%{box-shadow:inset 0 0 0 2px transparent}}
.editor-scroll pre[class*=language-]{background:#12121f;color:#d4d4d4;border-radius:0}
.token.tag{color:#569cd6}.token.attr-name{color:#9cdcfe}.token.attr-value{color:#ce9178}.token.punctuation{color:#d4d4d4}.token.comment{color:#6a9955}.token.doctype{color:#569cd6}.token.entity{color:#569cd6}
mark.search-highlight{background:#f59e0b;color:#000;border-radius:2px}
mark.search-highlight.current{background:#ff6b35;color:#000}
mark._editor_search{background:#f59e0b;color:#000}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toastIn .3s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.fadeout{animation:toastOut .3s ease-out forwards}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#4a4a6a}
::-webkit-scrollbar-corner{background:transparent}
.pane.drag-over .pane-body::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(74,158,255,.08);z-index:5;pointer-events:none}
</style>
</head>
<body>

<header class="toolbar">
    <span class="logo">HTMLeditor</span><span class="sep"></span>
    <button class="btn" id="btn-upload" title="Upload HTML file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload
    </button>
    <button class="btn primary" id="btn-download" title="Download modified HTML">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download
    </button><span class="sep"></span>
    <span class="filename" id="filename">demo.html</span>
    <div class="search-bar" id="search-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Search...">
        <span class="search-count" id="search-count"></span>
        <button class="btn search-nav" id="btn-prev" title="Previous">&uarr;</button>
        <button class="btn search-nav" id="btn-next" title="Next">&darr;</button>
        <button class="btn search-nav" id="btn-search-close" title="Close">&times;</button>
    </div>
    <span class="status"><span class="dot" id="status-dot"></span><span id="status-text">Ready</span></span>
</header>

<main class="main" id="main">
    <div class="pane" id="preview-pane">
        <div class="pane-header"><span class="dot-indicator" style="background:var(--accent)"></span>Preview / Edit</div>
        <div class="pane-body" id="preview-body">
            <iframe id="preview-frame"></iframe>
        </div>
    </div>
    <div class="divider" id="divider"></div>
    <div class="pane" id="source-pane">
        <div class="pane-header"><span class="dot-indicator" style="background:#f0a040"></span>Source Code <span style="margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0" id="line-count">0 lines</span></div>
        <div class="pane-body">
            <div class="editor-wrapper" id="editor-wrapper">
                <div class="line-numbers" id="line-numbers"></div>
                <div class="editor-scroll" id="editor-scroll">
                    <pre><code class="language-html" id="highlighted-code"></code></pre>
                    <textarea id="source-textarea" spellcheck="false" placeholder="Source code appears here..."></textarea>
                </div>
            </div>
        </div>
    </div>
</main>

<input type="file" id="file-input" accept=".html,.htm,text/html" style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
<script>
(function(){
var pf=document.getElementById('preview-frame'),
    pe=document.getElementById('preview-empty'),
    pb=document.getElementById('preview-body'),
    st=document.getElementById('source-textarea'),
    hc=document.getElementById('highlighted-code'),
    ln=document.getElementById('line-numbers'),
    es=document.getElementById('editor-scroll'),
    ew=document.getElementById('editor-wrapper'),
    fe=document.getElementById('filename'),
    sd=document.getElementById('status-dot'),
    sx=document.getElementById('status-text'),
    lc=document.getElementById('line-count'),
    dv=document.getElementById('divider'),
    pp=document.getElementById('preview-pane'),
    fi=document.getElementById('file-input'),
    sb=document.getElementById('search-bar'),
    si=document.getElementById('search-input'),
    sc=document.getElementById('search-count'),
    bp=document.getElementById('btn-prev'),
    bn=document.getElementById('btn-next'),
    bc=document.getElementById('btn-search-close');

var currentFilename='', originalHtml='', obs=null, poll=null, lastHtml='',
    updatingFromSource=false, suppressSourceUpdate=false,
    updateTimeout=null, sourceUpdateTimeout=null,
    searchMatches=[], searchIndex=0, searchActive=false, pendingSearch=null;

function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.classList.add('fadeout');setTimeout(function(){t.remove()},300)},2000)}
function setStatus(s){sd.className='dot';if(s==='syncing'){sd.classList.add('syncing');sx.textContent='Syncing...'}else if(s==='ready'){sx.textContent='Ready'}}
function updateLineNumbers(t){var c=(t||'').split('\n').length;lc.textContent=c+' lines';var h='';for(var i=1;i<=c;i++)h+='<span>'+i+'</span>';ln.innerHTML=h}
function highlightCode(t){hc.textContent=t;if(typeof Prism!=='undefined')Prism.highlightElement(hc);updateLineNumbers(t)}
function flash(){ew.classList.remove('flash');void ew.offsetWidth;ew.classList.add('flash')}

st.addEventListener('scroll',function(){es.scrollTop=st.scrollTop;es.scrollLeft=st.scrollLeft});

// ── ContentEditable polling sync (simple, robust) ──
function setupPreviewEditing(){
    var d=pf.contentDocument;
    if(!d||!d.body)return;
    d.body.contentEditable=true;
    var s=d.getElementById('_hint');
    if(!s){s=d.createElement('style');s.id='_hint';s.textContent='body{outline:2px dashed transparent;outline-offset:2px;min-height:100vh}body:hover{outline-color:rgba(74,158,255,.4)}body:focus{outline-color:rgba(74,158,255,.8)}';d.head.appendChild(s)}
    if(poll)clearInterval(poll);
    lastHtml=getClean(d);
    poll=setInterval(function(){
        if(updatingFromSource||searchActive)return;
        var cur=getClean(d);
        if(cur!==lastHtml){
            lastHtml=cur;
            syncPvToSrc(d);
        }
    },400);
}

function getClean(d){
    var h=d.getElementById('_hint');if(h)h.remove();
    var ce=d.body.hasAttribute('contenteditable');if(ce)d.body.removeAttribute('contenteditable');
    var html=d.documentElement.outerHTML;
    if(h)d.head.appendChild(h);if(ce)d.body.setAttribute('contenteditable','true');
    return html;
}

function syncPvToSrc(d){
    if(updatingFromSource)return;
    if(!d||!d.body)return;
    var full='<!DOCTYPE html>\n'+getClean(d);
    if(st.value===full)return;
    originalHtml=full;
    suppressSourceUpdate=true;
    st.value=full;
    highlightCode(full);
    if(searchActive&&si.value)performSearch(si.value);
    flash();
}

function syncSrcToPv(){
    var h=st.value;if(!h.trim())return;
    updatingFromSource=true;setStatus('syncing');
    pf.srcdoc=h;
    pf.addEventListener('load',function l(){pf.removeEventListener('load',l);setupPreviewEditing();originalHtml=h;updatingFromSource=false;setStatus('ready')});
}

function loadHtml(h,f){
    originalHtml=h;currentFilename=f||'index.html';fe.textContent=currentFilename;
    pf.style.display='block';pe.style.display='none';
    updatingFromSource=true;setStatus('syncing');pf.srcdoc=h;
    pf.addEventListener('load',function l(){pf.removeEventListener('load',l);setupPreviewEditing();updatingFromSource=false;setStatus('ready')});
    st.value=h;highlightCode(h);
}

st.addEventListener('input',function(){
    if(suppressSourceUpdate){suppressSourceUpdate=false;highlightCode(st.value);updateLineNumbers(st.value);return}
    highlightCode(st.value);updateLineNumbers(st.value);
    clearTimeout(sourceUpdateTimeout);
    sourceUpdateTimeout=setTimeout(function(){syncSrcToPv()},600);
});

// ── Download ──
function downloadHtml(){
    if(!originalHtml&&!st.value.trim()){toast('Nothing to download');return}
    var h=st.value||originalHtml,b=new Blob([h],{type:'text/html;charset=UTF-8'});
    var u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=currentFilename||'index.html';document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(u);
    toast('Downloaded: '+(currentFilename||'index.html'));
}
document.getElementById('btn-download').addEventListener('click',downloadHtml);
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();downloadHtml()}});

// ── Upload ──
document.getElementById('btn-upload').addEventListener('click',function(){fi.click()});
fi.addEventListener('change',function(){
    var f=fi.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(e){loadHtml(e.target.result,f.name);toast('Loaded: '+f.name)};
    r.onerror=function(){toast('File read failed')};r.readAsText(f,'UTF-8');fi.value='';
});

// ── Drag & drop ──
pb.addEventListener('dragover',function(e){e.preventDefault();pp.classList.add('drag-over')});
pb.addEventListener('dragleave',function(e){e.preventDefault();pp.classList.remove('drag-over')});
pb.addEventListener('drop',function(e){
    e.preventDefault();pp.classList.remove('drag-over');
    var f=e.dataTransfer.files[0];if(!f)return;
    if(!f.name.match(/\.html?$/i)){toast('Please drop .html or .htm files');return}
    var r=new FileReader();r.onload=function(ev){loadHtml(ev.target.result,f.name);toast('Loaded: '+f.name)};
    r.readAsText(f,'UTF-8');
});

// ── Resizable divider ──
var dragging=false;
dv.addEventListener('mousedown',function(e){e.preventDefault();dragging=true;dv.classList.add('active');document.body.style.cursor='col-resize';document.body.style.userSelect='none'});
document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    var r=document.getElementById('main').getBoundingClientRect(),x=e.clientX-r.left;
    var pct=Math.max(20,Math.min(80,(x/r.width)*100));
    pp.style.flex=pct;document.getElementById('source-pane').style.flex=(100-pct);
});
document.addEventListener('mouseup',function(){if(!dragging)return;dragging=false;dv.classList.remove('active');document.body.style.cursor='';document.body.style.userSelect=''});

// ── Search (simplified) ──
function clearSearch(){searchMatches=[];searchActive=false;highlightCode(st.value);var d=pf.contentDocument;if(d){d.querySelectorAll('mark._editor_search').forEach(function(m){m.parentNode.replaceChild(document.createTextNode(m.textContent),m)})}}
function performSearch(q){
    clearSearch();searchActive=true;searchMatches=[];searchIndex=0;
    if(!q){searchActive=false;return}
    var lo=q.toLowerCase(),ql=q.length,d=pf.contentDocument,total=0;
    if(d&&d.body){total=hlBody(d.body,lo,q)}
    highlightCode(st.value);
    if(total>0){
        var nm=[],p=0,w=document.createTreeWalker(hc,NodeFilter.SHOW_TEXT,null,false);
        while(w.nextNode()){var n=w.currentNode,l=n.textContent.length;nm.push({node:n,start:p,end:p+l});p+=l}
        var vt=nm.map(function(e){return e.node.textContent}).join(''),vi=0;
        while((vi=vt.toLowerCase().indexOf(lo,vi))!==-1&&searchMatches.length<total){searchMatches.push({start:vi,length:ql});vi+=ql}
        for(var mi=searchMatches.length-1;mi>=0;mi--)wrapPos(hc,searchMatches[mi].start,searchMatches[mi].length);
    }
    updateLineNumbers(st.value);
    if(searchMatches.length>0){sc.textContent='1/'+searchMatches.length;searchIndex=0;activate(0)}
    else sc.textContent='0/0';
}
function hlBody(root,lo,q){
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){if(n.parentNode.nodeName==='SCRIPT'||n.parentNode.nodeName==='STYLE')return 2;if(n.textContent.toLowerCase().indexOf(lo)===-1)return 1;return 1}});
    var tns=[];while(w.nextNode())tns.push(w.currentNode);
    var total=0;
    for(var i=0;i<tns.length;i++){
        var n=tns[i],text=n.textContent,lo2=text.toLowerCase(),idx=0,frag=document.createDocumentFragment(),last=0,count=0;
        while((idx=lo2.indexOf(lo,last))!==-1){if(idx>last)frag.appendChild(document.createTextNode(text.slice(last,idx)));var mk=document.createElement('mark');mk.className='_editor_search';mk.textContent=text.slice(idx,idx+q.length);frag.appendChild(mk);last=idx+q.length;lo2=text.toLowerCase();count++}
        if(count>0){if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));if(n.parentNode)n.parentNode.replaceChild(frag,n);total+=count}
    }
    return total;
}
function wrapPos(root,start,len){
    var nm=[],p=0,w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false);
    while(w.nextNode()){var n=w.currentNode,l=n.textContent.length;nm.push({node:n,start:p,end:p+l});p+=l}
    var te=start+len;
    for(var i=0;i<nm.length;i++){var e=nm[i];if(e.end<=start)continue;if(e.start>=te)break;var ls=Math.max(0,start-e.start),le=Math.min(e.node.textContent.length,te-e.start);if(le<=ls)continue;var text=e.node.textContent,bef=text.slice(0,ls),mid=text.slice(ls,le),aft=text.slice(le);var frag=document.createDocumentFragment();if(bef)frag.appendChild(document.createTextNode(bef));var mk=document.createElement('mark');mk.className='search-highlight';mk.textContent=mid;frag.appendChild(mk);if(aft)frag.appendChild(document.createTextNode(aft));var par=e.node.parentNode;if(par){par.insertBefore(frag,e.node);par.removeChild(e.node)}start+=(le-ls);if(start>=te)break}
}
function activate(idx){
    if(idx<0||idx>=searchMatches.length)return;
    hc.querySelectorAll('mark.search-highlight.current').forEach(function(m){m.classList.remove('current')});
    var am=hc.querySelectorAll('mark.search-highlight');if(am[idx]){am[idx].classList.add('current');am[idx].scrollIntoView({block:'center',behavior:'smooth'})}
    var d=pf.contentDocument;if(d){d.querySelectorAll('mark._editor_search.current').forEach(function(m){m.classList.remove('current')});var pm=d.querySelectorAll('mark._editor_search');if(pm[idx]){pm[idx].classList.add('current');pm[idx].scrollIntoView({block:'center',behavior:'smooth'})}}
    sc.textContent=(idx+1)+'/'+searchMatches.length;searchIndex=idx;
}
function nav(dir){if(searchMatches.length===0)return;var ni=searchIndex+dir;if(ni<0)ni=searchMatches.length-1;if(ni>=searchMatches.length)ni=0;activate(ni)}
si.addEventListener('input',function(){clearTimeout(pendingSearch);var q=si.value;pendingSearch=setTimeout(function(){performSearch(q)},300)});
si.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();nav(e.shiftKey?-1:1)}if(e.key==='Escape'){e.preventDefault();closeSearch()}});
bp.addEventListener('click',function(){nav(-1)});bn.addEventListener('click',function(){nav(1)});bc.addEventListener('click',closeSearch);
function closeSearch(){searchActive=false;clearSearch();sb.style.display='none';searchMatches=[];searchIndex=0;si.value='';sc.textContent=''}
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();sb.style.display='flex';si.focus();si.select()}});

// ── Init ──
